<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ten Questions. Discovery Branch Logic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15130f;
    --ink-2:#2c2823;
    --paper:#f4f0e8;
    --paper-2:#ece6d9;
    --kraft:#b07a3c;
    --kraft-deep:#8a5a26;
    --amber:#e0962a;
    --line:#d8cfbd;
    --line-2:#c4b89f;
    --green:#3f6b3a;
    --muted:#7a7163;
    --field:#e8dfcb;
    --shadow:0 1px 0 rgba(0,0,0,.04), 0 8px 28px -18px rgba(21,19,15,.4);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(176,122,60,.10), transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:34px 22px 90px;}

  /* ---------- Header ---------- */
  header.masthead{
    border:2px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    padding:26px 28px 22px;
    position:relative;
    overflow:hidden;
  }
  header.masthead::before{
    content:"";position:absolute;inset:0;
    background-image:repeating-linear-gradient(90deg, rgba(224,150,42,.16) 0 2px, transparent 2px 26px);
    opacity:.5;pointer-events:none;
  }
  .kicker{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--amber);margin:0 0 8px;position:relative;
  }
  .mantra{
    position:relative;margin:14px 0 0;padding:10px 0 0;
    border-top:1px solid rgba(224,150,42,.4);
    font-family:'Saira Condensed',sans-serif;font-weight:600;font-size:14px;
    letter-spacing:.18em;text-transform:uppercase;color:var(--amber);
  }
  .mantra span{color:#d9d1c2;font-weight:500;}
  h1{
    font-family:'Saira Condensed',sans-serif;
    font-weight:800;font-size:clamp(34px,6vw,62px);
    line-height:.92;letter-spacing:.01em;text-transform:uppercase;
    margin:0;position:relative;
  }
  h1 .thin{font-weight:500;color:var(--kraft);}
  .sub{
    position:relative;margin:14px 0 0;max-width:60ch;
    font-size:14.5px;color:#d9d1c2;
  }
  .sub b{color:var(--paper);font-weight:600;}

  /* ---------- Loop model ---------- */
  .model{
    display:grid;grid-template-columns:repeat(4,1fr);gap:0;
    border:2px solid var(--ink);border-top:none;
  }
  .model .cell{
    padding:14px 14px;border-right:1px solid var(--line-2);
    background:var(--paper-2);transition:background .12s, color .12s;
  }
  .model .cell:last-child{border-right:none;}
  .model .ct{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--kraft-deep);margin:0 0 5px;font-weight:600;
  }
  .model .ch{font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:18px;text-transform:uppercase;margin:0 0 4px;letter-spacing:.01em;}
  .model .cd{font-size:12.5px;color:var(--ink-2);margin:0;line-height:1.4;}
  .model .cn{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-top:6px;}

  /* job cells are clickable filters */
  .model .cell.job-cell{cursor:pointer;}
  .model .cell.job-cell:hover{background:var(--paper);}
  .model .cell.is-active{background:var(--ink);color:var(--paper);}
  .model .cell.is-active .ct{color:var(--amber);}
  .model .cell.is-active .ch{color:var(--paper);}
  .model .cell.is-active .cd{color:#d9d1c2;}
  .model .cell.is-active .cn{color:var(--amber);}

  /* gate cell is informational, not a filter */
  .model .cell.gate-cell{background:#fff0ee;}
  .model .cell.gate-cell .ct{color:#8b0000;}
  .model .cell.gate-cell .ch{color:#8b0000;}
  .model .cell.gate-cell .cd{color:#5c1a1a;}
  .model .cell.gate-cell .cn{color:#8b0000;}

  /* ---------- Toolbar ---------- */
  .toolbar{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    margin:22px 0 18px;
  }
  .search{
    flex:1 1 280px;display:flex;align-items:center;gap:8px;
    border:1.5px solid var(--line-2);background:#fff;padding:9px 13px;
  }
  .search input{border:none;outline:none;font-family:'IBM Plex Sans';font-size:14px;width:100%;background:transparent;color:var(--ink);}
  .search svg{flex:none;}
  button.tb{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);
    padding:9px 14px;cursor:pointer;transition:.12s;font-weight:500;
  }
  button.tb:hover{background:var(--ink);color:var(--paper);}
  button.tb.solid{background:var(--ink);color:var(--paper);}
  button.tb.solid:hover{background:var(--kraft-deep);border-color:var(--kraft-deep);}

  .legend{
    display:flex;flex-wrap:wrap;gap:14px;margin:0 0 24px;
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);
  }
  .legend .fk{
    background:var(--field);border:1px solid var(--line-2);color:var(--kraft-deep);
    padding:2px 7px;font-weight:600;letter-spacing:.04em;
  }

  /* ---------- Question cards ---------- */
  .q{border:2px solid var(--ink);margin-bottom:14px;background:var(--paper);box-shadow:var(--shadow);}
  .q.hidden{display:none;}
  .qhead{
    display:flex;align-items:flex-start;gap:18px;padding:18px 20px;cursor:pointer;
    user-select:none;transition:background .12s;
  }
  .qhead:hover{background:var(--paper-2);}
  .qnum{
    font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:46px;line-height:.8;
    color:var(--ink);flex:none;width:58px;text-align:center;
    border-right:2px solid var(--line-2);padding-right:14px;
  }
  .q.open .qnum{color:var(--kraft-deep);}
  .qtext{flex:1;min-width:0;}
  .qtitle{font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:25px;text-transform:uppercase;letter-spacing:.01em;margin:0 0 4px;line-height:1;}
  .qwhy{font-size:13px;color:var(--ink-2);margin:0;}
  .qjob{
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:#fff;padding:3px 8px;display:inline-block;margin-top:9px;font-weight:600;
  }
  .job-qualify{background:var(--green);}
  .job-matrix{background:var(--kraft-deep);}
  .job-next{background:var(--ink-2);}
  .chev{flex:none;align-self:center;transition:transform .2s;color:var(--muted);}
  .q.open .chev{transform:rotate(90deg);}

  .qbody{display:none;border-top:1.5px solid var(--line);padding:6px 20px 20px 20px;}
  .q.open .qbody{display:block;animation:fade .22s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}

  .fills{
    background:var(--paper-2);border:1px solid var(--line-2);padding:11px 14px;margin:12px 0 18px;
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  }
  .fills .flabel{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:2px;}
  .fk{
    font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--field);
    border:1px solid var(--line-2);color:var(--kraft-deep);padding:2px 8px;font-weight:600;letter-spacing:.03em;
  }

  /* ---------- Branch tree ---------- */
  .branch{margin-left:2px;border-left:2px solid var(--line);padding-left:0;}
  .node{position:relative;}
  .node > .nrow{
    position:relative;padding:7px 0 7px 22px;
  }
  .node > .nrow::before{
    content:"";position:absolute;left:0;top:18px;width:14px;height:0;border-top:2px solid var(--line);
  }
  .node.has-children > .nrow{cursor:pointer;}
  .nq{font-size:14px;color:var(--ink);font-weight:500;display:inline;}
  .node.has-children > .nrow .nq{font-weight:600;}
  .ntoggle{
    font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--kraft-deep);
    border:1px solid var(--line-2);background:var(--field);padding:0px 5px;margin-left:8px;
    display:inline-block;vertical-align:middle;font-weight:600;
  }
  .nhint{display:block;font-size:12px;color:var(--muted);margin-top:2px;font-style:italic;}
  .nfk{
    font-family:'IBM Plex Mono',monospace;font-size:10px;background:transparent;
    color:var(--kraft-deep);border:1px dashed var(--line-2);padding:1px 6px;margin-left:6px;font-weight:600;
    white-space:nowrap;
  }
  .children{display:none;margin-left:18px;}
  .node.open > .children{display:block;}
  .node.has-children > .nrow .ntoggle::after{content:"+ open";}
  .node.has-children.open > .nrow .ntoggle::after{content:"– close";}

  .script{
    background:var(--ink);color:var(--paper);padding:9px 13px;margin:8px 0 8px 22px;
    font-size:13px;border-left:3px solid var(--amber);
  }
  .script b{color:var(--amber);font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:3px;font-weight:600;}

  footer{margin-top:34px;border-top:2px solid var(--ink);padding-top:14px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;}

  @media (max-width:680px){
    .model{grid-template-columns:1fr;}
    .model .cell{border-right:none;border-bottom:1px solid var(--line-2);}
    .qnum{font-size:34px;width:42px;}
    .qtitle{font-size:20px;}
  }
  @media print{
    body{background:#fff;}
    .toolbar,.chev,.ntoggle{display:none!important;}
    .qbody,.children,.q.open .qbody{display:block!important;}
    .node>.children{display:block!important;}
    .q{break-inside:avoid;box-shadow:none;}
  }

  /* ---------- Special node types ---------- */
  /* RULE: business constraint, not a question */
  .type-rule > .nrow{background:#fdf6e3;border-left:3px solid var(--amber);padding:6px 0 6px 14px;}
  .type-rule > .nrow .nq{color:var(--kraft-deep);font-weight:700;font-size:13px;}
  .type-rule > .nrow::before{border-top-color:var(--amber);}

  /* GATE: required action. Hard blocker before Order Form */
  .type-gate > .nrow{background:#fff0ee;border:1.5px solid #c0392b;border-left:4px solid #c0392b;padding:8px 12px 8px 14px;}
  .type-gate > .nrow .nq{color:#8b0000;font-weight:700;font-size:13.5px;}
  .type-gate > .nrow::before{display:none;}

  /* REQUIRED: checklist item inside a gate */
  .type-required > .nrow{padding:5px 0 5px 14px;background:#fff8f7;}
  .type-required > .nrow .nq{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#5c1a1a;}
  .type-required > .nrow .nq::before{content:"☐  ";}
  .type-required > .nrow::before{border-top-color:#c0392b;}

  /* LOOP: cycle-back indicator */
  .type-loop > .nrow{background:var(--paper-2);border-left:3px solid var(--ink-2);padding:6px 0 6px 14px;}
  .type-loop > .nrow .nq{color:var(--ink-2);font-style:italic;font-size:13px;}
  .type-loop > .nrow::before{border-top-color:var(--ink-2);}

  /* NOTE: muted guidance, not a question */
  .type-note > .nrow .nq{color:var(--muted);font-style:italic;font-size:13px;font-weight:400;}

  /* SECTION-HEADER: bold label for sub-grouping */
  .type-section > .nrow .nq{
    font-family:'Saira Condensed',sans-serif;font-size:16px;text-transform:uppercase;
    font-weight:700;letter-spacing:.03em;color:var(--ink-2);
  }
  .type-section > .nrow{padding-top:9px;padding-bottom:6px;}

  /* XREF: clickable cross-reference jump chip */
  .xref{
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.04em;
    color:#fff;background:var(--ink-2);padding:2px 8px;margin-left:7px;
    cursor:pointer;display:inline-block;font-weight:600;text-transform:uppercase;
    transition:background .15s, transform .1s;white-space:nowrap;border:1px solid var(--ink-2);
  }
  .xref::before{content:"↗ ";color:var(--amber);}
  .xref:hover{background:var(--kraft-deep);border-color:var(--kraft-deep);transform:translateY(-1px);}
  .xref:active{transform:translateY(0);}

  /* XREF-FLASH: brief highlight on landed target */
  .xref-flash > .nrow,
  .xref-flash > .qhead{
    animation:xrefFlash 1.8s ease-out;
  }
  @keyframes xrefFlash{
    0%   {background:rgba(224,150,42,.55);}
    100% {background:transparent;}
  }

  /* ---------- Search counter and nav arrows ---------- */
  .search-counter{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);
    white-space:nowrap;padding:0 6px;letter-spacing:.03em;
  }
  .search-nav{
    background:transparent;border:1px solid var(--line-2);
    width:26px;height:26px;cursor:pointer;
    color:var(--ink-2);font-size:13px;font-weight:700;line-height:1;
    display:inline-flex;align-items:center;justify-content:center;
    transition:background .12s, border-color .12s;
  }
  .search-nav:hover:not(:disabled){background:var(--paper-2);border-color:var(--ink-2);}
  .search-nav:disabled{opacity:.28;cursor:not-allowed;}

  /* ---------- Search hit highlighting ---------- */
  .search-hit > .nrow{background:rgba(224,150,42,.22);}
  .search-current > .nrow{
    background:rgba(224,150,42,.55);
    outline:2px solid var(--amber);outline-offset:-2px;
  }
  .qhead.search-hit-q{background:rgba(224,150,42,.18);}

  /* ---------- Breadcrumb ---------- */
  .breadcrumb{
    position:sticky;top:0;z-index:5;
    background:var(--paper);
    border:1.5px solid var(--line-2);border-bottom:2px solid var(--ink);
    padding:10px 14px;margin-bottom:18px;
    font-family:'IBM Plex Mono',monospace;font-size:11px;
    letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);
    line-height:1.4;min-height:18px;
    box-shadow:0 4px 16px -10px rgba(21,19,15,.3);
  }
  .breadcrumb-segment{cursor:pointer;color:var(--kraft-deep);font-weight:600;}
  .breadcrumb-segment:hover{text-decoration:underline;text-underline-offset:3px;}
  .breadcrumb-sep{margin:0 7px;color:var(--muted);}
  .breadcrumb-current{color:var(--ink);font-weight:700;}
  .breadcrumb-empty{color:var(--muted);font-style:italic;font-weight:400;text-transform:none;letter-spacing:0;}

  /* ---------- Job filter (hide questions outside active job) ---------- */
  .q.hidden-by-job{display:none;}

  /* ---------- Essentials mode (hide non-essential branches) ---------- */
  #tree.essentials-on .node:not(.essential){display:none;}
  #essentialsToggle.is-active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  #essentialsToggle.is-active::before{content:"●  ";color:var(--amber);}

  /* ---------- v0.5 Packaging field manual system ---------- */
  :root{
    --ink:#171914;
    --ink-2:#34372f;
    --paper:#f1eee5;
    --paper-2:#e7e2d5;
    --kraft:#a9692f;
    --kraft-deep:#74411d;
    --amber:#e5a432;
    --line:#c8c0ae;
    --line-2:#9f9889;
    --green:#355c45;
    --muted:#6d6d63;
    --field:#ddd2ba;
    --signal:#e66b2e;
    --red:#a43228;
    --red-dark:#641e1a;
    --white:#fbfaf6;
    --shadow:0 16px 40px rgba(34,29,19,.08);
    --rail:252px;
  }
  html{scroll-behavior:smooth;}
  body{
    background:
      linear-gradient(rgba(23,25,20,.025) 1px,transparent 1px),
      linear-gradient(90deg,rgba(23,25,20,.025) 1px,transparent 1px),
      var(--paper);
    background-size:24px 24px;
    font-family:'Archivo',sans-serif;
  }
  button,input{font:inherit;}
  button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--amber);outline-offset:3px;}
  .skip-link{position:fixed;top:8px;left:8px;z-index:100;background:var(--ink);color:var(--white);padding:9px 13px;transform:translateY(-150%);}
  .skip-link:focus{transform:none;}
  .wrap{max-width:1440px;padding:24px 28px 80px;}

  header.masthead{
    min-height:300px;border-width:1px;padding:30px 34px 28px;
    display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:48px;
  }
  header.masthead::before{
    background:
      linear-gradient(90deg,transparent 0 68%,rgba(229,164,50,.08) 68% 68.15%,transparent 68.15%),
      repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 24px);
    opacity:1;
  }
  header.masthead::after{
    content:"FIELD MANUAL  /  SALES TRAINING";
    position:absolute;right:-112px;top:128px;transform:rotate(90deg);
    font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.24em;color:rgba(255,255,255,.28);
  }
  .cover-main{position:relative;align-self:end;}
  .cover-meta{
    position:relative;border-left:1px solid rgba(255,255,255,.22);
    padding-left:22px;display:flex;flex-direction:column;justify-content:space-between;
  }
  .cover-meta p{margin:0;}
  .cover-meta .issue{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#bcb9ad;}
  .cover-meta .issue strong{display:block;color:var(--amber);font-size:27px;letter-spacing:-.04em;margin-top:6px;}
  .cover-meta .status{border-top:1px solid rgba(255,255,255,.22);padding-top:14px;font-size:12px;color:#d8d3c7;}
  .cover-meta .status b{display:block;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.15em;color:var(--signal);text-transform:uppercase;margin-bottom:5px;}
  .kicker{font-size:10px;letter-spacing:.24em;margin-bottom:38px;}
  h1{font-family:'Archivo',sans-serif;font-weight:900;font-size:clamp(38px,5.2vw,72px);line-height:.86;letter-spacing:-.065em;}
  h1 .thin{font-weight:500;color:#b97a43;letter-spacing:-.05em;}
  .sub{margin-top:20px;max-width:67ch;font-size:14px;line-height:1.65;color:#cac6ba;}
  .mantra{margin-top:25px;padding-top:13px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.15em;}
  .mantra span{padding:0 8px;color:#77776f;}

  .model{border-width:1px;}
  .model .cell{min-height:150px;padding:20px;border-color:var(--line);background:rgba(241,238,229,.94);}
  .model .ct{font-size:9px;letter-spacing:.16em;margin-bottom:22px;}
  .model .ch{font-family:'Archivo',sans-serif;font-size:17px;font-weight:800;letter-spacing:-.03em;}
  .model .cd{font-size:12px;line-height:1.45;}
  .model .cell.gate-cell{
    background:repeating-linear-gradient(135deg,rgba(164,50,40,.05) 0 8px,transparent 8px 16px),#f3dfd8;
  }
  .model .cell.gate-cell .ct,.model .cell.gate-cell .ch,.model .cell.gate-cell .cn{color:var(--red-dark);}
  .model .cell.gate-cell .cd{color:#542823;}

  .workbench{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);gap:34px;margin-top:34px;align-items:start;}
  .manual-index{position:sticky;top:18px;border-top:5px solid var(--ink);background:rgba(241,238,229,.96);padding-top:15px;}
  .index-label{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;}
  .index-list{border-top:1px solid var(--line);}
  .index-link{
    width:100%;display:grid;grid-template-columns:34px 1fr;gap:9px;align-items:center;
    background:transparent;color:var(--ink);border:0;border-bottom:1px solid var(--line);
    padding:10px 5px;text-align:left;cursor:pointer;
  }
  .index-link:hover,.index-link.is-current{background:var(--ink);color:var(--white);}
  .index-link .ix{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--kraft-deep);}
  .index-link:hover .ix,.index-link.is-current .ix{color:var(--amber);}
  .index-link .it{font-size:11px;font-weight:700;line-height:1.25;}
  .index-note{margin-top:18px;padding:15px;border:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.5;}
  .index-note b{display:block;color:var(--ink);text-transform:uppercase;font-size:10px;margin-bottom:5px;}
  .manual-content{min-width:0;}

  .toolbar{display:grid;grid-template-columns:minmax(260px,1fr) auto auto auto;gap:8px;align-items:stretch;margin:0 0 12px;}
  .search{border:1px solid var(--ink);background:var(--white);padding:9px 12px;min-width:0;}
  .search input{font-family:'Archivo',sans-serif;font-size:13px;min-width:60px;}
  button.tb{font-size:9px;border-width:1px;padding:9px 12px;font-weight:600;}
  .legend{gap:7px;margin-bottom:18px;padding:0 2px;font-size:9px;}
  .legend > span:first-child{margin-right:5px;padding-top:3px;}
  .legend .fk{background:transparent;border-width:1px;padding:2px 6px;}

<script>
/* =========================================================================
   DATA MODEL. Edit here to update the framework.

   Node schema (recursive):
     q:         string   required. The question or statement text.
     hint:      string   optional. Rep-side coaching note (italic, muted).
     fk:        array    optional. RFQ / Order Form fields this answer fills.
                         Valid tags: DESCRIPTION, QTY, UNIT, PRICE, COST, VENDOR,
                         FOB, LEAD TIME, GTM, TERMS, ORDER DATE, SHIP VIA, WEIGHT.
     script:    string   optional. Exact words for the rep to say. Renders as
                         a dark callout. Use sparingly, only high-leverage lines.
     type:      string   optional. Visual variant:
                           "rule"     amber, business constraint, not a question
                           "gate"     red border, required action before Order Form
                           "required" checklist item inside a gate
                           "loop"     cycle-back indicator
                           "note"     muted guidance, not a question
                           "section"  bold section header
     id:        string   optional. Stable DOM id for xref jump targets.
                         Conventions: "target-<noun>" for branches,
                         auto "q-<n>" assigned to top-level question cards.
     xref:      array    optional. Cross-reference jump chips rendered inline.
                         Each entry: { label:"chip text", target:"target-id" }
     children:  array    optional. Nested nodes (same schema, recursive).

   Top-level question schema:
     n:        number   1 to 10
     title:    string   the question
     job:      string   "qualify" | "matrix" | "next" (controls badge color)
     jobLabel: string   the visible badge text
     why:      string   one-line rationale shown when the card opens
     fills:    array    aggregate RFQ/Order fields this whole question feeds
     branches: array    the discovery tree under this question
   ========================================================================= */
const DATA = [
  {
    n:1, title:"What do you do?", job:"qualify", jobLabel:"Job 1 · Qualify",
    why:"Industry profile predicts the whole packaging spend. Read the business before you read the buyer.",
    fills:["context for ALL"],
    branches:[
      { q:"What industry / what's the end product?", hint:"Vertical dictates the spec profile.", children:[
        { q:"Food & beverage?", fk:["DESCRIPTION"], hint:"FDA-grade liners, moisture, cold chain, grease resistance." },
        { q:"Electronics / components?", fk:["DESCRIPTION"], hint:"ESD / anti-static foam & bag, desiccant, moisture-barrier." },
        { q:"Heavy industrial / metal / machined?", fk:["DESCRIPTION"], hint:"High ECT / double-double wall, edge protect, VCI, banding." },
        { q:"E-commerce / fulfillment?", fk:["DESCRIPTION","UNIT"], hint:"DIM-weight box optimization, mailers, void fill, dunnage." },
        { q:"Medical / pharma?", fk:["DESCRIPTION"], hint:"Sterile barrier, lot traceability, validation, tamper-evident." },
        { q:"3PL / contract packager?", fk:["QTY","VENDOR"], hint:"They buy for many clients = volume + program sell." }
      ]},
      { q:"Who are THEIR customers? B2B, retail, or DTC?", hint:"Retail-ready / shelf-ready changes print and structure.", fk:["DESCRIPTION"] },
      { q:"Other locations or sister companies?", id:"target-multi-location", fk:["QTY","VENDOR"], xref:[{label:"Q10 Sister Cos", target:"target-sisters"}], hint:"Multi-site = consolidation play + bigger blanket.", children:[
        { q:"Does each site buy independently or is it central?", fk:["VENDOR"] },
        { q:"Same SKUs across sites?", fk:["QTY"], hint:"Cross-site standardization = leverage on cost." }
      ]},
      { q:"Who's the decision-maker vs the spec-er vs the influencer?", hint:"Procurement signs, ops specs, owner overrules. Map all three.", children:[
        { q:"Who actually feels the pain when packaging fails?", hint:"That person is your champion." },
        { q:"Who has budget authority and at what dollar threshold?", fk:["PRICE"] }
      ]},
      { q:"Growing, flat, or shrinking?", fk:["QTY"], hint:"Future volume changes how hard you invest now." }
    ]
  },
  {
    n:2, title:"What do you buy?", job:"matrix", jobLabel:"Job 2 · Buy Matrix",
    why:"The core SKU map. Loop this per product line. Everything they touch in, on, and around the box.",
    fills:["DESCRIPTION","UNIT"],
    branches:[
      { q:"CORRUGATED: boxes or sheets?", id:"target-corrugated", fk:["DESCRIPTION"], hint:"Separate conversations. Work each lane fully before moving on.", children:[

        /* ── BOXES ── */

      { q:"Locked into a contract? When does it end?", fk:["LEAD TIME"], xref:[{label:"Q9 Renewal Date", target:"target-renewal"}], hint:"Feeds Q9 timing." },
      { q:"What would actually make you switch?", hint:"If they can't answer, they won't switch. Disqualify or dig for real pain." }
    ]
  },
  {
    n:6, title:"How are you shipping items?", job:"next", jobLabel:"Job 3 · Next Move",
    why:"How it leaves the dock. Fills FOB, SHIP VIA, WEIGHT. Will flagged this. Branch hard on every shipping mode.",
    fills:["FOB","SHIP VIA","WEIGHT","DESCRIPTION"],
    branches:[
      { q:"Carrier mode?", fk:["SHIP VIA","FOB"], children:[
        { q:"Parcel: FedEx, UPS, USPS?", fk:["SHIP VIA"], children:[
          { q:"Getting hit on dimensional weight?", fk:["DESCRIPTION"], hint:"Right-size boxes = direct freight savings = our hook." }
        ]},
        { q:"LTL, full truckload, or own fleet?", fk:["SHIP VIA","FOB"] }
      ]},
      { q:"Palletized?", fk:["WEIGHT","DESCRIPTION"], children:[
        { q:"Pallet type and size? Weight per pallet?", fk:["WEIGHT","DESCRIPTION"] },
        { q:"How high do they stack? Stack pattern?", hint:"Tall/unstable loads = stretch + edge protect + banding redesign." },
        { q:"How are loads unitized: stretch, strap, both?", fk:["DESCRIPTION"], xref:[{label:"Q2 Stretch Film", target:"target-stretch"}], children:[
          { q:"Hand or machine wrap on the load?", fk:["DESCRIPTION"], hint:"Loops back to Q2 stretch-film branch." },
          { q:"Film gauge on the load? Over-wrapping (revolutions)?", fk:["COST"], hint:"Wrap audit = quantifiable savings story." }
        ]}
      ]},
      { q:"How far is it going?", fk:["FOB","DESCRIPTION"], children:[
        { q:"Local, regional, national, or export?", fk:["FOB"], children:[
          { q:"Export → ISPM-15 heat-treated pallets? Container or break-bulk?", fk:["DESCRIPTION"] }
        ]},
        { q:"Long transit = more handling = more damage exposure.", hint:"Distance justifies protective upgrades." }
      ]},
      { q:"Environmental exposure in transit?", fk:["DESCRIPTION"], children:[
        { q:"Weather exposed? Outdoor staging?", fk:["DESCRIPTION"], hint:"Moisture-resistant board, wax/poly coat, shrink." },
        { q:"Cold rooms / frozen / refrigerated?", fk:["DESCRIPTION"], hint:"Wet-strength board, adhesive performance at temp matters." },
        { q:"High humidity? Metal parts (rust)?", fk:["DESCRIPTION"], hint:"VCI paper/film + desiccant." }
      ]},
      { q:"Damage / claims history on shipments?", hint:"Existing damage = the single best opening to redesign and add margin.", fk:["GTM"] },
      { q:"Dock equipment: forklift, pallet jack, manual?", hint:"Affects unit size and palletization advice." }
    ]
  },
  {
    n:7, title:"How much do you buy?", job:"matrix", jobLabel:"Job 2 · Buy Matrix",
    why:"Order size per item. Loops with Q3 to size the annual. The more they buy, the better the price.",
    fills:["QTY","UNIT","PRICE"],
    branches:[
      { q:"Typical order size per SKU: eaches, cases, pallets, truckloads?", fk:["QTY","UNIT"], hint:"Volume tier sets the price break and our cost negotiation." },
      { q:"Annual volume on the top 3 movers?", fk:["QTY"], hint:"80/20 rule: find where the spend actually concentrates." },
      { q:"Busy season vs slow season?", fk:["QTY"], hint:"Pre-buy / seasonal blanket opportunity." },
      { q:"Purchased how: by count, by pound, by roll, by load?", fk:["UNIT"], hint:"Match our UNIT to how they think to avoid quote confusion." },
      { q:"Total annual packaging spend, ballpark?", fk:["QTY","GTM"], hint:"Sizes the prize and your effort level." }
    ]
  },
  {
    n:8, title:"Who do you buy from?", job:"matrix", jobLabel:"Job 2 · Buy Matrix",
    why:"The competitive map. Loops back into Q2 per vendor. Knowing the source tells us where to win.",
    fills:["VENDOR","COST"],
    branches:[
      { q:"List every vendor (could be one, could be five).", id:"target-vendors", fk:["VENDOR"], hint:"Then loop each one back through the questions below.", children:[
        { q:"What category does each vendor own?", fk:["VENDOR"], xref:[{label:"Q2 Buy Matrix", target:"q-2"}], hint:"Loops to Q2. What from whom." },
        { q:"Distributor or manufacturer-direct on each?", fk:["COST","VENDOR"], hint:"Direct = price-driven and harder; distributor = service gaps to exploit." },
        { q:"Why that vendor: price, service, geography, sole-source?", hint:"Find the dissatisfaction. There's always a soft spot." },
        { q:"Any sole-source risk that scares them?", hint:"Single-source = our reliability / second-source pitch." },
        { q:"Local or national? How's the rep relationship?", hint:"Weak rep coverage = open door." }
      ]},
      { q:"Anyone they've fired before and why?", hint:"Tells you the dealbreakers to avoid and the gaps to fill." }
    ]
  },
  {
    n:9, title:"When will you order again?", job:"next", jobLabel:"Job 3 · Next Move",
    why:"The displacement window. Fills LEAD TIME and sets your re-quote timing.",
    fills:["LEAD TIME","ORDER DATE"],
    branches:[
      { q:"When's the next PO going out?", fk:["LEAD TIME","ORDER DATE"] },
      { q:"Where's current inventory. Burning down or just restocked?", hint:"Just restocked = play the long game and schedule the follow-up." },
      { q:"Manufacturer lead times they live with today?", fk:["LEAD TIME"], hint:"If we beat their lead time, that's a wedge." },
      { q:"Contract / agreement renewal date?", id:"target-renewal", fk:["LEAD TIME"], hint:"Best displacement timing. Mark the calendar now." },
      { q:'The displacement line.', script:'Place this order with your current vendor, and let us quote the items you ordered and the rest of your floor for next time.' }
    ]
  },
  {
    n:10, title:"Who else does what you do?", job:"qualify", jobLabel:"Job 1 · Qualify",
    why:"Turns one account into a vertical. Become the supplier for the whole category.",
    fills:["pipeline"],
    branches:[
      { q:"Who are your competitors in the area?", hint:"Same end-product = same packaging needs = warm-ish targets." },
      { q:"Who are your partners or supply-chain neighbors?", hint:"Their suppliers and customers also ship things." },
      { q:"Anyone you'd introduce us to if we take care of you?", hint:"Ask for the referral while goodwill is fresh." },
      { q:"Sister companies or other divisions?", id:"target-sisters", fk:["VENDOR"], xref:[{label:"Q1 Locations", target:"target-multi-location"}], hint:"Loops to Q1 multi-location." }
    ]
  }
];

/* =========================================================================
   RENDER
   ========================================================================= */
const state = { questionIndex:1, path:[] };
const refs = {
  questionStrip:document.getElementById('questionStrip'),
  pathQuestion:document.getElementById('pathQuestion'),
  pathList:document.getElementById('pathList'),
  pathBack:document.getElementById('pathBack'),
  decisionContext:document.getElementById('decisionContext'),
  decisionProgress:document.getElementById('decisionProgress'),
  decisionCard:document.getElementById('decisionCard'),
  decisionKicker:document.getElementById('decisionKicker'),
  decisionTitle:document.getElementById('decisionTitle'),
  decisionHint:document.getElementById('decisionHint'),
  decisionOptions:document.getElementById('decisionOptions'),
  decisionLeaf:document.getElementById('decisionLeaf'),
  coachCue:document.getElementById('coachCue'),
  outcomeScore:document.getElementById('outcomeScore'),
  outcomeFields:document.getElementById('outcomeFields'),
  gateStatus:document.getElementById('gateStatus'),
  search:document.getElementById('mapSearch'),
  searchCount:document.getElementById('mapSearchCount'),
  searchResults:document.getElementById('searchResults')
};

function esc(value){
  return String(value).replace(/[&<>"']/g,char=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  })[char]);
}

function currentQuestion(){
  return DATA[state.questionIndex];
}

function currentNode(){
  return state.path.length ? state.path[state.path.length-1] : null;
}

function currentChoices(){
  const node = currentNode();
  return node ? (node.children || []) : currentQuestion().branches;
}

function compactLabel(value,max=48){
  const clean = value.replace(/^⚠️\s*/,'').replace(/^RULE:\s*/,'');
  return clean.length > max ? clean.slice(0,max-1)+'…' : clean;
}

function nodeMeta(node){
  if(node.type === 'gate') return 'Blocking gate';
  if(node.type === 'loop') return 'Loops back through the sequence';
  if(node.type === 'rule') return 'Business rule';
  if(node.type === 'section') return 'Open this lane';
  if(node.children && node.children.length) return node.children.length+' next moves';
  if(node.fk && node.fk.length) return 'Captures '+node.fk.join(', ');
  return 'Record the answer';
}

function findPathById(nodes,target,path=[]){
  for(const node of nodes){
    const next=[...path,node];
    if(node.id === target) return next;
    if(node.children){
      const found=findPathById(node.children,target,next);
      if(found) return found;
    }
  }
  return null;
}

function findTarget(target){
  if(target && target.startsWith('q-')){
    const n=Number(target.slice(2));
    return Number.isInteger(n) && n >= 1 && n <= DATA.length ? {questionIndex:n-1,path:[]} : null;
  }
  for(let i=0;i<DATA.length;i++){
    const path=findPathById(DATA[i].branches,target);
    if(path) return {questionIndex:i,path};
  }
  return null;
}

function renderQuestionStrip(){
  refs.questionStrip.innerHTML=DATA.map((q,index)=>`
    <button class="map-question${index===state.questionIndex?' is-active':''}" type="button" data-q="${index}">
      <span class="mq-num">Q${String(q.n).padStart(2,'0')} / ${esc(q.jobLabel.replace(/^Job \d · /,''))}</span>
      <span class="mq-title">${esc(q.title)}</span>
    </button>`).join('');
  refs.questionStrip.querySelectorAll('.map-question').forEach(button=>{
    button.addEventListener('click',()=>{
      state.questionIndex=Number(button.dataset.q);
      state.path=[];
      render();
    });
  });
}

function renderPath(){
  const q=currentQuestion();
  refs.pathQuestion.textContent='Q'+q.n+' · '+q.title;
  const steps=[
    {code:'Q'+q.n,label:q.title,status:state.path.length?'done':'current'},
    ...state.path.map((node,index)=>({
      code:String(q.n)+'.'+String(index+1).padStart(2,'0'),
      label:compactLabel(node.q,42),
      status:index===state.path.length-1?'current':'done'
    }))
  ];
  const choices=currentChoices();
  if(choices.length && state.path.length){
    steps.push({code:'NEXT',label:compactLabel(choices[0].q,42),status:'upcoming'});
  }
  refs.pathList.innerHTML=steps.map(step=>`
    <li class="path-step is-${step.status}">
      <span class="path-dot">${step.status==='done'?'✓':''}</span>
      <span class="path-code">${esc(step.code)}</span>
      <span class="path-copy">${esc(step.label)}</span>
    </li>`).join('');
  refs.pathBack.disabled=state.path.length===0;
}

function renderDecision(){
  const q=currentQuestion();
  const node=currentNode();
  const choices=currentChoices();
  const xrefs=node && node.xref ? node.xref : [];
  refs.decisionContext.textContent='Q'+q.n+' / '+q.jobLabel.replace(/^Job \d · /,'');
  refs.decisionProgress.textContent=state.path.length+' moves deep';
  refs.decisionKicker.textContent=node ? (node.type==='gate'?'Blocking gate':'Current decision') : 'Choose a branch';
  refs.decisionTitle.textContent=node ? node.q : q.title;
  refs.decisionHint.textContent=node ? (node.hint || q.why) : q.why;
  refs.decisionOptions.innerHTML='';
  refs.decisionLeaf.hidden=choices.length>0 || xrefs.length>0;

  if(choices.length){
    choices.forEach(choice=>{
      const button=document.createElement('button');
      button.type='button';
      button.className='decision-option';
      button.innerHTML=`<span class="do-copy">${esc(choice.q)}<span class="do-meta">${esc(nodeMeta(choice))}</span></span><span class="do-arrow">→</span>`;
      button.addEventListener('click',()=>{
        state.path.push(choice);
        render();
        refs.decisionCard.focus({preventScroll:true});
      });
      refs.decisionOptions.appendChild(button);
    });
  }

  if(xrefs.length){
    const label=document.createElement('p');
    label.className='xref-label';
    label.textContent='Related conversation';
    refs.decisionOptions.appendChild(label);
    xrefs.forEach(xref=>{
      const button=document.createElement('button');
      button.type='button';
      button.className='decision-option xref-option';
      button.innerHTML=`<span class="do-copy">${esc(xref.label)}<span class="do-meta">Jump to the related branch</span></span><span class="do-arrow">↗</span>`;
      button.addEventListener('click',()=>{
        const target=findTarget(xref.target);
        if(!target) return;
        state.questionIndex=target.questionIndex;
        state.path=[...target.path];
        render();
        refs.decisionCard.focus({preventScroll:true});
      });
      refs.decisionOptions.appendChild(button);
    });
  }

  if(!choices.length && !xrefs.length){
    refs.decisionLeaf.innerHTML='<strong>Answer captured</strong>This branch ends here. Return one step to explore another answer, or choose another opener above.';
  }

  const cue=node && (node.script || node.hint);
  refs.coachCue.hidden=!cue;
  refs.coachCue.classList.toggle('script-cue',Boolean(node && node.script));
  if(cue){
    refs.coachCue.innerHTML=`<b>${node.script?'Say it like this':'Coaching cue'}</b><span>${esc(node.script || node.hint)}</span>`;
  }
}

function collectedFields(){
  const fields=[];
  state.path.forEach(node=>(node.fk||[]).forEach(field=>{
    if(!fields.includes(field)) fields.push(field);
  }));
  return fields;
}

function activeGate(){
  for(let i=state.path.length-1;i>=0;i--){
    if(state.path[i].type==='gate') return state.path[i];
  }
  return null;
}

function renderOutcome(){
  const q=currentQuestion();
  const fields=collectedFields();
  const goal=[...new Set(q.fills)];
  const completedGoals=goal.filter(field=>fields.includes(field)).length;
  refs.outcomeScore.textContent=completedGoals+' / '+goal.length;
  refs.outcomeFields.innerHTML=fields.length
    ? fields.map(field=>`<span class="outcome-field">${esc(field)}</span>`).join('')
    : '<span class="outcome-empty">Choose a branch to begin capturing fields.</span>';
  const gate=activeGate();
  if(gate){
    const required=(gate.children||[]).filter(node=>node.type==='required');
    refs.gateStatus.innerHTML=`
      <p class="panel-label">Gate status</p>
      <div class="gate-card">
        <strong>Order Form blocked</strong>
        <span>${esc(gate.q)}</span>
        ${required.length?`<ul class="gate-list">${required.map(item=>`<li>□ ${esc(item.q)}</li>`).join('')}</ul>`:''}
      </div>`;
  }else{
    refs.gateStatus.innerHTML='<p class="panel-label">Gate status</p><div class="outcome-empty">No blocker on the current path.</div>';
  }
}

function render(){
  renderQuestionStrip();
  renderPath();
  renderDecision();
  renderOutcome();
}

function buildSearchIndex(){
  const rows=[];
  DATA.forEach((q,questionIndex)=>{
    rows.push({questionIndex,path:[],title:q.title,context:'Q'+q.n+' opener'});
    const walk=(nodes,path=[])=>nodes.forEach(node=>{
      const next=[...path,node];
      rows.push({questionIndex,path:next,title:node.q,context:'Q'+q.n+' · '+next.slice(0,-1).map(n=>compactLabel(n.q,20)).join(' / ')});
      if(node.children) walk(node.children,next);
    });
    walk(q.branches);
  });
  return rows;
}

const searchIndex=buildSearchIndex();
refs.search.addEventListener('input',()=>{
  const term=refs.search.value.trim().toLowerCase();
  if(term.length<2){
    refs.searchResults.classList.remove('is-open');
    refs.searchResults.innerHTML='';
    refs.searchCount.textContent='';
    return;
  }
  const matches=searchIndex.filter(row=>
    row.title.toLowerCase().includes(term) || row.context.toLowerCase().includes(term)
  ).slice(0,18);
  refs.searchCount.textContent=String(matches.length);
  refs.searchResults.innerHTML=matches.length ? matches.map((row,index)=>`
    <button class="search-result" type="button" data-result="${index}" role="option">
      <b>${esc(compactLabel(row.title,76))}</b>
      <span>${esc(row.context)}</span>
    </button>`).join('') : '<div class="search-result"><b>No matches</b><span>Try another product, field, or coaching term.</span></div>';
  refs.searchResults.classList.add('is-open');
  refs.searchResults.querySelectorAll('[data-result]').forEach(button=>{
    button.addEventListener('click',()=>{
      const row=matches[Number(button.dataset.result)];
      state.questionIndex=row.questionIndex;
      state.path=[...row.path];
      refs.search.value='';
      refs.searchCount.textContent='';
      refs.searchResults.classList.remove('is-open');
      render();
      refs.decisionCard.focus();
    });
  });
});

document.addEventListener('click',event=>{
  if(!event.target.closest('.map-search-wrap') && !event.target.closest('.search-results')){
    refs.searchResults.classList.remove('is-open');
  }
});

refs.pathBack.addEventListener('click',()=>{
  state.path.pop();
  render();
  refs.decisionCard.focus({preventScroll:true});
});

document.getElementById('mapReset').addEventListener('click',()=>{
  state.path=[];
  render();
  refs.decisionCard.focus();
});

document.addEventListener('keydown',event=>{
  if(event.key==='Escape'){
    refs.searchResults.classList.remove('is-open');
    refs.search.value='';
    refs.searchCount.textContent='';
  }
});

render();
</script>
</body>
</html>
